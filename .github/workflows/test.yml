name: Tests

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.pre-commit-config.yaml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ master, main, develop ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # 通用检查（尾随空格 / YAML / 大文件）+ __version__.py 的 black/flake8/isort
    - name: Run pre-commit
      run: uvx pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: lint
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        # 与 Dockerfile-go 的 golang:1.26-bookworm 对齐，出货镜像的工具链被 CI 覆盖；
        # go.mod 的 go 1.24 是语言最低版本，两者不冲突
        go-version: '1.26'
        cache: true

    # internal/projectinit 的测试执行真实 hugo 命令（版本对齐 Dockerfile-go）
    - name: Install Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.163.3'
        extended: true

    - name: Vet
      run: go vet ./...

    # -coverpkg 跨包统计：httpapi 等集成测试的执行会计入被测包。
    # 每个测试二进制都会输出全量块，需按块取最大计数去重后
    # 再交给 go tool cover / Codecov，否则统计失真。
    - name: Test
      run: |
        set -o pipefail
        go test -race -coverprofile=coverage.out -coverpkg=./internal/...,./cmd/... ./...
        awk 'NR==1 { mode = $0; next }
        {
          key=$1; stmts=$(NF-1); cnt=$NF
          stmt[key]=stmts
          if (!(key in max) || cnt > max[key]) max[key]=cnt
        }
        END { print mode; for (k in stmt) print k, stmt[k], max[k] }' coverage.out > coverage.merged
        mv coverage.merged coverage.out
        go tool cover -func=coverage.out | tail -1

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    # 测试失败时也可下载 profile 排查
    - name: Upload profile artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-profile
        path: coverage.out
