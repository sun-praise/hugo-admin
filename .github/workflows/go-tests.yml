name: Go Tests

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-tests.yml'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # projectinit / hugo 包的测试会执行真实的 hugo 命令
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.1'
          extended: true

      - name: Vet
        run: go vet ./...

      # -coverpkg 跨包统计：每个测试二进制都会输出全量块，需按块取最大值去重
      - name: Test with coverage
        run: |
          go test ./... -race -coverprofile=coverage.out -coverpkg=./internal/...,./cmd/...
          awk 'NR==1 { print "mode: atomic"; next }
          {
            key=$1; stmts=$(NF-1); cnt=$NF
            stmt[key]=stmts
            if (!(key in max) || cnt > max[key]) max[key]=cnt
          }
          END { for (k in stmt) print k, stmt[k], max[k] }' coverage.out > coverage.merged
          mv coverage.merged coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Upload profile artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out
