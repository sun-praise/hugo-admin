name: Deploy MkDocs to GitHub Pages

# 触发：main 分支推送（限定 docs/、mkdocs.yml、workflow 文件）+ 手动 dispatch
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 同一部署并发：旧构建未完成时不打断，等它跑完再发新的
concurrency:
  group: pages
  cancel-in-progress: false

# workflow 级别只给 read；Pages / OIDC 凭据收在 deploy job 内
# build 只装 PyPI 包 + 跑 mkdocs build，不应持有部署凭据
permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.11-${{ hashFiles('docs/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-3.11-

      # Python 实现已移除，文档依赖直接从 requirements.txt 装，不再依赖 pyproject.toml / uv.lock
      - name: Install docs dependencies
        run: |
          uv venv
          uv pip install -r docs/requirements.txt

      - name: Build (strict)
        run: .venv/bin/mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
